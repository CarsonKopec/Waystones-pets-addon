plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin'
    id 'net.darkhax.curseforgegradle'
    id "com.modrinth.minotaur"
}

version = version
group = group

base {
    archivesName = "${mod_id}-forge-${mod_version}-${minecraft_version}"
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    
    if (project.hasProperty('forge_ats_enabled') && project.findProperty('forge_ats_enabled').toBoolean()) {
        // This location is hardcoded in Forge and can not be changed.
        // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
        project.logger.debug('Forge Access Transformers are enabled for this project.')
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":Common").sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":Common").sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modDataRun {
                    source sourceSets.main
                    source project(":Common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url "https://cursemaven.com" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("net.blay09.mods:balm-forge:${balm_version}") {
        changing = balm_version.endsWith("SNAPSHOT")
    }
    implementation fg.deobf("net.blay09.mods:waystones-forge:${waystones_version}")
    compileOnly project(":Common")
}

tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

processResources {
    from(project(":Common").sourceSets.main.resources)
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description, 'credits': mod_credits,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}


jar.finalizedBy('reobfJar')

// reobfJar rewrites the jar in place, so upload only once it has run.
tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn 'reobfJar'
    description = 'Publishes the Forge build to CurseForge.'
    group = 'publishing'

    apiToken = secret('CURSEFORGE_TOKEN')
    def projectId = secret('CURSEFORGE_PROJECT_ID')
    doFirst {
        if (!apiToken || !projectId) {
            throw new GradleException('Set CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID in .env to publish to CurseForge.')
        }
    }

    if (projectId) {
        def mainFile = upload(projectId, jar.archiveFile.get().asFile)
        mainFile.changelog = rootProject.file('CHANGELOG.md').text
        mainFile.addModLoader("Forge")
        mainFile.addRequirement("balm")
        mainFile.addRequirement("waystones")
        minecraft_version.split(',').toList().each { mainFile.addGameVersion(it.trim()) }
        mainFile.releaseType = release_type
    }
}

modrinth {
    token = secret('MODRINTH_TOKEN')
    projectId = secret('MODRINTH_PROJECT_ID')
    versionName = base.archivesName.get()
    versionNumber = mod_version
    versionType = release_type
    uploadFile = jar.archiveFile
    gameVersions = minecraft_version.split(',').collect { it.trim() }
    loaders = ["forge"]
    dependencies {
        required.project "MBAkmtvl" // Balm
        required.project "LOpKHB2A" // Waystones
    }
    changelog = rootProject.file('CHANGELOG.md').text
}

tasks.named('modrinth') {
    dependsOn 'reobfJar'
}
