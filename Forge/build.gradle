plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle'
    id 'net.darkhax.curseforgegradle'
    id "com.modrinth.minotaur"
}

version = version
group = group

base {
    archivesName = "${mod_id}-forge-${mod_version}-${minecraft_version}"
}

// Game tests: Common's test sources plus a small test-only mod that registers them, kept out of the release jar.
sourceSets {
    gametest {
        java.srcDir project(":Common").file("src/gametest/java")
        resources.srcDir project(":Common").file("src/gametest/resources")
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

// ForgeGradle only makes run tasks for source sets that depend on Forge, so the test mod's source set inherits the
// main dependencies. Its runs then load both the mod and the test mod from their classpath.
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

// Forge runs on Mojang names since 1.20.6, so the jar ships as compiled; ForgeGradle 7 no longer reobfuscates.
minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }
        register('client') {
            // ./gradlew :Forge:runClientCheck (runGametestClient) opens a game window, plays through the pet screens in
            // a new world, saves screenshots to build/clientcheck/screenshots and exits non-zero on failure.
            with(sourceSets.gametest) {
                workingDir = layout.projectDirectory.dir('build/clientcheck')
                systemProperty 'waystonespetsaddon.clientcheck', 'true'
            }
        }
        register('server') {
            args '--nogui'
        }

        // ./gradlew :Forge:runGametestGameTestServer runs every game test on a headless server, then stops.
        register('gameTestServer') {
            workingDir = layout.projectDirectory.dir('build/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

// Each game test run starts from a fresh world and config, so nothing left by a failed run, or by a run for another
// Minecraft version, can affect it.
tasks.matching { it.name == 'runGametestGameTestServer' }.configureEach {
    doFirst { project.delete(file('build/gametest/world'), file('build/gametest/config')) }
}
tasks.matching { it.name == 'runGametestClient' }.configureEach {
    doFirst {
        def dir = file('build/clientcheck')
        project.delete(new File(dir, 'saves'), new File(dir, 'config'), new File(dir, 'screenshots'))
        dir.mkdirs()
        // Skips the first-launch screens, keeps the game going while its window is in the background, and mutes it.
        new File(dir, 'options.txt').text = 'onboardAccessibility:false\ntutorialStep:none\njoinedFirstServer:true\n' +
                'pauseOnLostFocus:false\nsoundCategory_master:0.0\n'
    }
}
tasks.register('runClientCheck') {
    group = 'verification'
    description = 'Plays through the pet screens in a real client.'
    dependsOn 'runGametestClient'
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url "https://cursemaven.com" }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Their POMs list Balm's common jar and libraries the mod jars already bundle; on Forge's module path those
    // duplicate packages stop the game from starting.
    implementation("net.blay09.mods:balm-forge:${balm_forge_version}") {
        transitive = false
        changing = balm_forge_version.endsWith("SNAPSHOT")
    }
    implementation("net.blay09.mods:waystones-forge:${waystones_version}") {
        transitive = false
    }
    compileOnly project(":Common")
}

tasks.named("compileJava", JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

processResources {
    from(project(":Common").sourceSets.main.resources)
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description, 'credits': mod_credits,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}



tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn 'jar'
    description = 'Publishes the Forge build to CurseForge.'
    group = 'publishing'

    apiToken = secret('CURSEFORGE_TOKEN')
    def projectId = secret('CURSEFORGE_PROJECT_ID')
    doFirst {
        if (!apiToken || !projectId) {
            throw new GradleException('Set CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID in .env to publish to CurseForge.')
        }
    }

    if (projectId) {
        def mainFile = upload(projectId, jar.archiveFile.get().asFile)
        mainFile.changelog = rootProject.file('CHANGELOG.md').text
        mainFile.addModLoader("Forge")
        mainFile.addRequirement("balm")
        mainFile.addRequirement("waystones")
        minecraft_version.split(',').toList().each { mainFile.addGameVersion(it.trim()) }
        // CurseForge requires an environment; the mod runs on both sides.
        mainFile.addGameVersion("Client", "Server")
        mainFile.releaseType = release_type
    }
}

modrinth {
    token = secret('MODRINTH_TOKEN')
    projectId = secret('MODRINTH_PROJECT_ID')
    versionName = base.archivesName.get()
    versionNumber = mod_version
    versionType = release_type
    uploadFile = jar.archiveFile
    gameVersions = minecraft_version.split(',').collect { it.trim() }
    loaders = ["forge"]
    dependencies {
        required.project "MBAkmtvl" // Balm
        required.project "LOpKHB2A" // Waystones
    }
    changelog = rootProject.file('CHANGELOG.md').text
}

tasks.named('modrinth') {
    dependsOn 'jar'
}
