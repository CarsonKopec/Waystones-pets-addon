plugins {
    id 'java'
    id 'net.neoforged.moddev'
    id 'net.darkhax.curseforgegradle'
    id "com.modrinth.minotaur"
}

group = group

base {
    archivesName = "${mod_id}-neoforge-${mod_version}-${minecraft_version}"
}

// Game tests: Common's test sources plus a small test-only mod that registers them, kept out of the release jar.
sourceSets {
    gametest {
        java.srcDir project(":Common").file("src/gametest/java")
        resources.srcDir project(":Common").file("src/gametest/resources")
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            loadedMods = [mods."${mod_id}"]
        }

        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}"]
        }

        // ./gradlew :NeoForge:runGameTestServer runs every game test on a headless server, then stops.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
}

// Each game test run starts from a fresh world and config, so nothing left by a failed run, or by a run for another
// Minecraft version, can affect it.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { project.delete(file('build/gametest/world'), file('build/gametest/config')) }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Their POMs list Balm's common jar and optional integrations that aren't needed and aren't always published; the
    // mod jars bundle what they do need.
    implementation("net.blay09.mods:balm-neoforge:${balm_version}") {
        transitive = false
    }
    implementation("net.blay09.mods:waystones-neoforge:${waystones_version}") {
        transitive = false
    }
    compileOnly project(":Common")
}

tasks.named('compileJava', JavaCompile).configure {
    source(project(":Common").sourceSets.main.allSource)
}

processResources {
    from(project(":Common").sourceSets.main.resources)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var gameVersions = neoforge_game_versions.split(',').collect { it.trim() }
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: gameVersions.size() == 1 ? "[${gameVersions[0]}]" : "[${gameVersions.first()},${gameVersions.last()}]",
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            neo_loader_version_range: neo_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_credits            : mod_credits,
            waystones_version_range: waystones_version_range,
            balm_version_range     : balm_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn jar
    description = 'Publishes the NeoForge build to CurseForge.'
    group = 'publishing'

    apiToken = secret('CURSEFORGE_TOKEN')
    def projectId = secret('CURSEFORGE_PROJECT_ID')
    doFirst {
        if (!apiToken || !projectId) {
            throw new GradleException('Set CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID in .env to publish to CurseForge.')
        }
    }

    if (projectId) {
        def mainFile = upload(projectId, jar.archiveFile.get().asFile)
        mainFile.changelog = rootProject.file('CHANGELOG.md').text
        mainFile.addModLoader("NeoForge")
        mainFile.addRequirement("balm")
        mainFile.addRequirement("waystones")
        neoforge_game_versions.split(',').toList().each { mainFile.addGameVersion(it.trim()) }
        // CurseForge requires an environment; the mod runs on both sides.
        mainFile.addGameVersion("Client", "Server")
        mainFile.releaseType = release_type
    }
}

modrinth {
    token = secret('MODRINTH_TOKEN')
    projectId = secret('MODRINTH_PROJECT_ID')
    versionName = base.archivesName.get()
    versionNumber = mod_version
    versionType = release_type
    uploadFile = jar
    gameVersions = neoforge_game_versions.split(',').collect { it.trim() }
    loaders = ["neoforge"]
    dependencies {
        required.project "MBAkmtvl" // Balm
        required.project "LOpKHB2A" // Waystones
    }
    changelog = rootProject.file('CHANGELOG.md').text
}
