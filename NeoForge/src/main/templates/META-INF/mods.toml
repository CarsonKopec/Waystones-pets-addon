modLoader="javafml"
loaderVersion="${neo_loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

# Works around Waystones 15.2.0 crashing every teleport on NeoForge 20.2.86+.
[[mixins]]
config="waystonespetsaddon.neoforge.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
mandatory=true
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="waystones"
mandatory=true
versionRange="[15.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="balm"
mandatory=true
versionRange="[8.0.0,)"
ordering="AFTER"
side="BOTH"
