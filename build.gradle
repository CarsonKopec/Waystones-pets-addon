plugins {
    id 'fabric-loom' version '1.4-SNAPSHOT' apply(false)
    // id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT' apply(false) // this causes ForgeGradle to fail in reobf
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7" // this is required for VanillaGradle and NeoForge to exist in harmony
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT' apply(false)
    id 'net.darkhax.curseforgegradle' version '1.1.18' apply(false)
    id "com.modrinth.minotaur" version "2.+" apply(false)
}

// Publishing credentials (CURSEFORGE_TOKEN, CURSEFORGE_PROJECT_ID, MODRINTH_TOKEN, MODRINTH_PROJECT_ID) come from
// environment variables or from the git-ignored .env file next to this one, one KEY=value per line.
def dotEnv = new Properties()
if (file('.env').exists()) {
    file('.env').withReader('UTF-8') { dotEnv.load(it) }
}
ext.secret = { String key -> System.getenv(key) ?: dotEnv.getProperty(key)?.trim() }

subprojects {
    
    apply plugin: 'java'
    
    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    java.withSourcesJar()
    java.withJavadocJar()
        
    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'              : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
    }

    repositories {
        mavenCentral()
        maven {
            url "https://maven.twelveiterations.com/repository/maven-public/"
        }
        maven {
            url "https://repo.spongepowered.org/repository/maven-public/"
        }
        maven {
            url "https://maven.minecraftforge.net"
        }
        maven {
            url "https://maven.neoforged.net/releases"
        }
    }

    apply from: rootProject.file('repositories.gradle')

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(java_version.toInteger())
    }

    tasks.withType(Javadoc).configureEach {
        failOnError false
    }
}
