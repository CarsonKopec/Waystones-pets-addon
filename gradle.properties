# Project
mod_version=0.1.1
group=com.github.imagineforgee
release_type=release

# Common
mixin_version=0.8.5
java_version=21
minecraft_version=1.21.3
minecraft_version_range=[1.21.3]
# The vanilla build Common compiles against: https://maven.neoforged.net/releases/net/neoforged/neoform
neo_form_version=1.21.3-20241023.131943
common_runs_enabled=false
common_client_run_name=Common Client
common_server_run_name=Common Server

# Forge (not built on this branch: Waystones has no Forge build for 1.21.3)
forge_version=52.1.20
//forge_ats_enabled=true
forge_version_range=[52,)
loader_version_range=[52,)
# Forge only finds a mod's classes when they sit in the same folder as its resources; this has ForgeGradle merge them.
net.minecraftforge.gradle.merge-source-sets=true

# Fabric
fabric_api_version=0.114.1+1.21.3
fabric_loader_version=0.19.5
# The oldest Fabric Loader the mod accepts: the newest minimum among Waystones and Balm.
fabric_loader_min=0.16.7
# Every Minecraft version the Fabric jar declares and is published for; each one passes the game tests.
# Not 1.21.2: Forge Config API Port, which the Fabric config uses, has no build for it.
fabric_game_versions=1.21.3

# NeoForge
neo_version=21.3.100
neo_version_range=[21.2,)
# Every Minecraft version the NeoForge jar declares and is published for; each one passes the game tests.
neoforge_game_versions=1.21.2,1.21.3
neo_loader_version_range=[2,)

#neogradle.subsystems.parchment.minecraftVersion=1.21.8
#neogradle.subsystems.parchment.mappingsVersion=2025.09.14

# Mod options
mod_name=Waystones pets addon
mod_author=ImagineForgee
mod_id=waystonespetsaddon
mod_license=Apache License 2.0
mod_authors=ImagineForgee
mod_description=Adds the ability to automatically teleport your tamed pets with you when using Waystones no leads required
mod_credits=

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Common dependencies
## https://maven.twelveiterations.com/service/rest/repository/browse/maven-public/net/blay09/mods/waystones-common/
### Waystones
waystones_version=21.3.3+1.21.3
waystones_forge_version=21.3.3+1.21.3

## https://maven.twelveiterations.com/service/rest/repository/browse/maven-public/net/blay09/mods/balm-common/
### Balm
balm_version=21.3.5+1.21.3
# Forge builds against an older Balm: 21.0.64 and later on the maven list a nested Kuma jar they leave out, which
# stops Forge from loading. Players can use any Balm 21.0; Waystones does not need Kuma.
balm_forge_version=21.0.63+1.21.1
## Fabric dependencies
## https://github.com/Fuzss/modresources/tree/main/maven/fuzs/forgeconfigapiport/forgeconfigapiport-fabric
forge_config_version=21.3.5
