plugins {
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_name}-common-${minecraft_version}"
}

// Plain Minecraft with no mod loader, so Common can only use what every loader has.
neoForge {
    neoFormVersion = neo_form_version
}

repositories {
    maven {
        url "https://repo.spongepowered.org/repository/maven-public/"
        content {
            includeGroup "org.spongepowered"
        }
    }
    maven {
        url "https://maven.twelveiterations.com/repository/maven-public/"
        content {
            includeGroup "net.blay09.mods"
        }
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:$mixin_version"
    compileOnly("net.blay09.mods:balm-common:$balm_version") {
        exclude(group: "net.blay09.mods", module: "shared-bridge")
        changing = balm_version.endsWith("SNAPSHOT")
    }

    compileOnly "net.blay09.mods:waystones-common:${waystones_version}"
    // Waystones' teleport context builds on Shogi's.
    compileOnly("net.blay09.mods:shogi-api:${shogi_api_version}") {
        transitive = false
    }
}

sourceSets.main.resources.srcDir('src/generated/resources')


// Game tests run inside each loader's test server and are compiled there; they never ship in the mod jars.
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}
