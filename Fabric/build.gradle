plugins {
    id 'fabric-loom'
    id 'maven-publish'
    id 'idea'
    id 'net.darkhax.curseforgegradle'
    id "com.modrinth.minotaur"
}

version = version
group = group

base {
    archivesName = "${mod_id}-fabric-${mod_version}-${minecraft_version}"
}

repositories {
    maven { url "https://maven.blamejared.com/"}
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://cursemaven.com" }
    maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven {
        url = "https://jm.gserv.me/repository/maven-public/"
        content {
            includeGroup "info.journeymap"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation("net.blay09.mods:waystones-fabric:${waystones_version}") {
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
    modImplementation("net.blay09.mods:balm-fabric:${balm_version}") {
        exclude(group: "net.blay09.mods", module: "shared-bridge")
        exclude group: "net.fabricmc", module: "fabric-loader"
        transitive = false
        changing = balm_version.endsWith("SNAPSHOT")
    }
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
    implementation 'com.electronwill.night-config:core:3.6.5'
    implementation 'com.electronwill.night-config:toml:3.6.5'
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_version}"
    implementation project(":Common")
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            // Loom picks a random name each launch, which changes the player's UUID and orphans tamed pets.
            programArgs("--username", "Dev")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

afterEvaluate {
    loom.mixin.useLegacyMixinAp = false
}

processResources {
    from(project(":Common").sourceSets.main.resources)

    var replaceProperties = [minecraft_version   : minecraft_version, fabric_loader_version: fabric_loader_version,
                             fabric_api_version: fabric_api_version, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
                             mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'net.fabricmc' && details.requested.name == 'fabric-loader') {
            details.useVersion fabric_loader_version
            details.because 'Avoid duplicate Fabric Loader versions on classpath'
        }
    }
}


tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn remapJar
    description = 'Publishes the Fabric build to CurseForge.'
    group = 'publishing'

    apiToken = secret('CURSEFORGE_TOKEN')
    def projectId = secret('CURSEFORGE_PROJECT_ID')
    doFirst {
        if (!apiToken || !projectId) {
            throw new GradleException('Set CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID in .env to publish to CurseForge.')
        }
    }

    if (projectId) {
        def mainFile = upload(projectId, remapJar.archiveFile.get().asFile)
        mainFile.changelog = rootProject.file('CHANGELOG.md').text
        mainFile.addModLoader("Fabric")
        mainFile.addRequirement("fabric-api")
        mainFile.addRequirement("balm-fabric")
        mainFile.addRequirement("waystones-fabric")
        mainFile.addRequirement("forge-config-api-port-fabric")
        minecraft_version.split(',').toList().each { mainFile.addGameVersion(it.trim()) }
        mainFile.releaseType = release_type
    }
}

modrinth {
    token = secret('MODRINTH_TOKEN')
    projectId = secret('MODRINTH_PROJECT_ID')
    versionName = base.archivesName.get()
    versionNumber = mod_version
    versionType = release_type
    uploadFile = remapJar
    gameVersions = minecraft_version.split(',').collect { it.trim() }
    loaders = ["fabric"]
    dependencies {
        required.project "P7dR8mSH" // Fabric API
        required.project "MBAkmtvl" // Balm
        required.project "LOpKHB2A" // Waystones
        required.project "ohNO6lps" // Forge Config API Port
    }
    changelog = rootProject.file('CHANGELOG.md').text
}